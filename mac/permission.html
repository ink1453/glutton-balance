<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>饭桶余额 · 权限引导</title>
<style>
  html, body { margin: 0; padding: 0; background: #121214; color: #eaeaec;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif; }
  #wrap { padding: 18px 20px 16px; }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  p { font-size: 12.5px; line-height: 1.65; color: #b1b1b6; margin: 0 0 10px; }
  .item { border: 1px solid #2a2a2e; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #18181b; }
  .item h2 { font-size: 13px; margin: 0 0 4px; color: #eaeaec; }
  .item .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .must { background: rgba(226,126,112,.18); color: #e27e70; }
  .opt { background: rgba(196,163,114,.16); color: #c4a372; }
  .btn { display: inline-block; margin: 2px 8px 2px 0; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #55555b; background: #1e1e21; color: #eaeaec; font-size: 12px; cursor: pointer; }
  .btn:hover { background: #252528; }
  .btn.primary { background: #76ca9f; border-color: #76ca9f; color: #0d2418; font-weight: 600; }
  .cmd { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #838389;
    background: #101012; border-radius: 6px; padding: 8px 10px; user-select: text; word-break: break-all; }
  #retry { margin-top: 4px; }
  #state { font-size: 11.5px; color: #838389; margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>饭桶余额需要屏幕录制权限</h1>
  <p>饭桶本身在 Mac 上可用。首次运行时，请在「系统设置 → 隐私与安全性 → 屏幕录制」里允许「饭桶余额」。程序不会自己点，也不会绕过系统弹窗。</p>
  <div class="item">
    <h2>屏幕录制<span class="tag must">必须</span></h2>
    <p>饭桶需要截取 Coopanion 桌宠窗口，计算头顶/脚底位置，才能贴在桌宠旁边。<br>说明：只截桌宠自己的窗口，不录屏、不上传、不保存图片。</p>
    <button class="btn primary" id="open-screen">打开「屏幕录制」设置</button>
  </div>
  <div class="item">
    <h2>辅助功能<span class="tag opt">无需授权</span></h2>
    <p>饭桶不需要辅助功能权限即可显示和跟随桌宠；请不要把「辅助功能」是否授权当作饭桶运行状态。若饭桶未显示，请先检查上面的屏幕录制权限，并确认 Coopanion 桌宠正在运行。</p>
    <button class="btn" id="open-ax">打开「辅助功能」设置（无需操作）</button>
  </div>
  <button class="btn primary" id="retry">我已允许屏幕录制，重新检测</button>
  <div id="state"></div>
</div>
<script>
  const api = window.pbpGuide || null;
  function bind(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  bind('open-screen', () => api && api.openSettings('screen'));
  bind('open-ax', () => api && api.openSettings('accessibility'));
  bind('retry', () => api && api.retry());
  if (api) api.onStatus((s) => {
    document.getElementById('state').textContent = s;
  });
</script>
</body>
</html>
